<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">CI/CD system architecture</title><desc id="desc">Developer commits to GitHub, GitHub Actions and Jenkins run checks, then Docker smoke testing and Kubernetes deployment manifests describe two API replicas behind a ClusterIP service.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1200" height="610" rx="22" fill="#f8fafc"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">CI/CD system architecture</text><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a" stroke-width="2"><rect x="35" y="120" width="170" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7"/><text x="120" y="161" stroke="none">Developer</text><rect x="270" y="120" width="190" height="70" rx="12" fill="#f1f5f9" stroke="#64748b"/><text x="365" y="161" stroke="none">GitHub Repository</text><rect x="535" y="75" width="190" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="630" y="116" stroke="none">GitHub Actions</text><rect x="535" y="190" width="190" height="70" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="630" y="231" stroke="none">Jenkins Pipeline</text><rect x="800" y="120" width="180" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="890" y="148" stroke="none">Quality + security</text><text x="890" y="171" stroke="none">+ tests</text><rect x="800" y="260" width="180" height="70" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="890" y="289" stroke="none">Docker build</text><text x="890" y="311" stroke="none">+ smoke test</text><rect x="1020" y="260" width="145" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="1092" y="289" stroke="none">Kubernetes</text><text x="1092" y="311" stroke="none">manifests</text><rect x="800" y="410" width="180" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="890" y="438" stroke="none">Deployment</text><text x="890" y="461" stroke="none">2 replicas</text><rect x="1020" y="410" width="145" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="1092" y="438" stroke="none">ClusterIP</text><text x="1092" y="461" stroke="none">Service</text><rect x="800" y="520" width="365" height="55" rx="12" fill="#f1f5f9" stroke="#64748b"/><text x="982" y="553" stroke="none">Flask API / Gunicorn</text></g><g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"><path d="M205 155 H270"/><path d="M460 145 L535 110"/><path d="M460 165 L535 225"/><path d="M725 110 L800 145"/><path d="M725 225 L800 165"/><path d="M890 190 V260"/><path d="M980 295 H1020"/><path d="M1092 330 V410"/><path d="M1020 445 H980"/><path d="M890 480 V520"/></g><text x="40" y="560" font-family="Arial,sans-serif" font-size="15" fill="#475569">CI validates and smoke-tests; image publishing and cluster deployment are not automated.</text></svg>