<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">CI/CD validation flow</title><desc id="desc">A commit runs checkout, dependency installation, lint, security checks, tests, Docker build and smoke test, then Kubernetes schema validation. Failed health checks fail the job.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1000" height="760" rx="22" fill="#f8fafc"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">CI/CD validation flow</text><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a" stroke-width="2"><rect x="340" y="80" width="320" height="52" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="112" stroke="none">Commit / Pull Request</text><rect x="340" y="165" width="320" height="52" rx="12" fill="#f1f5f9" stroke="#64748b"/><text x="500" y="197" stroke="none">Checkout source + install deps</text><rect x="340" y="250" width="320" height="52" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="282" stroke="none">Ruff → Bandit → pip-audit</text><rect x="340" y="335" width="320" height="52" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="367" stroke="none">pytest + JUnit report</text><rect x="340" y="420" width="320" height="52" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="452" stroke="none">Build Docker image</text><rect x="340" y="505" width="320" height="52" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="500" y="537" stroke="none">Run container + readiness check</text><rect x="340" y="590" width="320" height="52" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="500" y="622" stroke="none">Validate Kubernetes schemas</text><rect x="700" y="505" width="245" height="52" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="822" y="537" stroke="none">Fail job + print logs</text><rect x="340" y="675" width="320" height="52" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="707" stroke="none">Checks complete</text></g><g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"><path d="M500 132 V165"/><path d="M500 217 V250"/><path d="M500 302 V335"/><path d="M500 387 V420"/><path d="M500 472 V505"/><path d="M500 557 V590"/><path d="M500 642 V675"/><path d="M660 531 H700"/></g><text x="710" y="485" font-family="Arial,sans-serif" font-size="14" fill="#b91c1c">If unhealthy</text></svg>