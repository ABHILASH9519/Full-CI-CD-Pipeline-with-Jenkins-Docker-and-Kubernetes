<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">Kubernetes topology</title><desc id="desc">An in-namespace client accesses a ClusterIP service that routes to two Flask and Gunicorn pods. A NetworkPolicy limits ingress and a PodDisruptionBudget maintains one available pod during supported voluntary disruptions.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1000" height="570" rx="22" fill="#f8fafc"/><text x="35" y="45" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0f172a">Kubernetes topology</text><rect x="40" y="80" width="920" height="450" rx="20" fill="#fff" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="9 7"/><text x="65" y="112" font-family="Arial,sans-serif" font-size="17" fill="#475569">Application namespace</text><g font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#0f172a" stroke-width="2"><rect x="90" y="215" width="190" height="75" rx="12" fill="#f1f5f9" stroke="#64748b"/><text x="185" y="245" stroke="none">In-namespace</text><text x="185" y="268" stroke="none">client</text><rect x="370" y="215" width="210" height="75" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="475" y="245" stroke="none">ClusterIP Service</text><text x="475" y="268" stroke="none">port 80</text><rect x="690" y="150" width="220" height="75" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="800" y="180" stroke="none">Pod 1 · UID 10001</text><text x="800" y="203" stroke="none">Flask / Gunicorn :8080</text><rect x="690" y="285" width="220" height="75" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="800" y="315" stroke="none">Pod 2 · UID 10001</text><text x="800" y="338" stroke="none">Flask / Gunicorn :8080</text><rect x="110" y="405" width="330" height="70" rx="12" fill="#fee2e2" stroke="#dc2626"/><text x="275" y="434" stroke="none">NetworkPolicy</text><text x="275" y="457" stroke="none">Ingress: same namespace</text><rect x="530" y="405" width="330" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="695" y="434" stroke="none">PodDisruptionBudget</text><text x="695" y="457" stroke="none">minAvailable: 1</text></g><g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"><path d="M280 252 H370"/><path d="M580 235 L690 188"/><path d="M580 270 L690 322"/></g><g fill="none" stroke-width="2" stroke-dasharray="6 5"><path d="M275 405 L740 225" stroke="#dc2626"/><path d="M310 405 L740 360" stroke="#dc2626"/><path d="M695 405 L800 360" stroke="#16a34a"/></g><text x="65" y="510" font-family="Arial,sans-serif" font-size="14" fill="#475569">NetworkPolicy enforcement depends on the cluster CNI; configure approved ingress explicitly.</text></svg>