name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Static security analysis
        run: bandit -q -r app
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Unit tests
        run: pytest -q --junitxml=test-results.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results.xml
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - name: Build container
        run: docker build --tag cicd-demo:ci .
      - name: Smoke test container
        run: |
          set -eu
          docker run --detach --rm --name cicd-demo-ci -p 18080:8080 cicd-demo:ci
          cleanup() { docker stop cicd-demo-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then
              curl --fail --silent http://127.0.0.1:18080/api/v1/info
              exit 0
            fi
            sleep 1
          done
          docker logs cicd-demo-ci
          exit 1
